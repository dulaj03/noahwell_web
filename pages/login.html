<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in or create your NOAHVELLE account for exclusive collections, order tracking, and curated fashion edits." />
  <title>NOAHVELLE — Sign In / Create Account</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <div class="auth-container">

    <!-- Left: Editorial Fashion Image -->
    <div class="auth-image">
      <img
        src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1200&q=85"
        alt="NOAHVELLE Editorial Fashion Silhouette"
        loading="eager"
      />
      <div class="auth-image-overlay">
        <div class="auth-brand">NOAHVELLE</div>
        <p class="auth-tagline">"Elegance is not about being noticed. It's about being remembered."</p>
      </div>
    </div>

    <!-- Right: Authentication Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-container">

        <div class="auth-top-nav">
          <a href="../index.html" class="auth-back-link">
            &larr; Back to Boutique
          </a>
        </div>

        <div class="auth-mobile-brand">NOAHVELLE</div>

        <!-- Tab switcher -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" data-tab="login" role="tab" aria-selected="true" type="button">SIGN IN</button>
          <button class="auth-tab" data-tab="signup" role="tab" aria-selected="false" type="button">CREATE ACCOUNT</button>
        </div>

        <!-- 1. SIGN IN SECTION -->
        <div id="login-form-section" class="auth-section active" role="tabpanel">
          <h1>WELCOME BACK</h1>
          <p class="auth-subtitle">Sign in to access your bag, saved wishlist, and orders.</p>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="login-email">Email Address</label>
              <input
                type="email"
                id="login-email"
                name="email"
                placeholder="your.email@example.com"
                autocomplete="email"
                required
              />
              <span class="field-error" id="login-email-error"></span>
            </div>

            <div class="form-group">
              <label for="login-password">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  placeholder="Your password"
                  autocomplete="current-password"
                  required
                />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁</button>
              </div>
              <span class="field-error" id="login-password-error"></span>
            </div>

            <div class="form-row-inline">
              <label class="checkbox-label">
                <input type="checkbox" id="remember-me" checked />
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link" onclick="if(window.showToast) window.showToast('Password reset link sent to your email.', 'info'); return false;">
                FORGOT PASSWORD?
              </a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
              SIGN IN
            </button>

            <div class="auth-divider">
              <span>OR</span>
            </div>

            <button
              type="button"
              class="btn-google"
              onclick="if(window.showToast) window.showToast('Connecting to Google Single Sign-On...', 'info')"
            >
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              Continue with Google
            </button>
          </form>
        </div>

        <!-- 2. SIGN UP SECTION -->
        <div id="signup-form-section" class="auth-section" role="tabpanel">
          <h1>CREATE YOUR ACCOUNT</h1>
          <p class="auth-subtitle">Join NOAHVELLE for priority drops and bespoke privileges.</p>

          <form id="signup-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="signup-first">First Name</label>
                <input type="text" id="signup-first" name="firstName" placeholder="Elena" required />
                <span class="field-error" id="signup-first-error"></span>
              </div>
              <div class="form-group">
                <label for="signup-last">Last Name</label>
                <input type="text" id="signup-last" name="lastName" placeholder="Vance" required />
                <span class="field-error" id="signup-last-error"></span>
              </div>
            </div>

            <div class="form-group">
              <label for="signup-email">Email Address</label>
              <input type="email" id="signup-email" name="email" placeholder="your.email@example.com" autocomplete="email" required />
              <span class="field-error" id="signup-email-error"></span>
            </div>

            <div class="form-group">
              <label for="signup-password">Password</label>
              <div class="password-wrapper">
                <input type="password" id="signup-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁</button>
              </div>
              <div class="password-strength" id="password-strength"></div>
              <span class="field-error" id="signup-password-error"></span>
            </div>

            <div class="form-group">
              <label for="signup-confirm">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="signup-confirm" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁</button>
              </div>
              <span class="field-error" id="signup-confirm-error"></span>
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="agree-terms" required />
                <span>I agree to the <a href="privacy-policy.html" target="_blank" style="text-decoration:underline;">Privacy Policy</a> &amp; Terms of Service.</span>
              </label>
              <span class="field-error" id="terms-error"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
              CREATE ACCOUNT
            </button>
          </form>
        </div>

      </div><!-- /.auth-form-container -->
    </div><!-- /.auth-form-panel -->

  </div><!-- /.auth-container -->

  <!-- Scripts -->
  <script src="../js/main.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/wishlist.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>

</body>
</html>
